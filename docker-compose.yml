services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: findhabitat-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: findhabitat-init-db
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./docker/sqlserver/init-db.sh:/init-db.sh
    command: /bin/bash /init-db.sh
    restart: "no"
  backend:
    build:
      context: ./backend
    container_name: findhabitat-backend
    depends_on:
      init-db:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=findhabitat;encrypt=true;trustServerCertificate=true;"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    expose:
      - "8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: findhabitat-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlserver-data: